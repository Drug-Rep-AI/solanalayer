[package]
name = "drugrep_verifier"
version = "0.1.0"
description = "DrugRep Proof Layer verifier: checks Groth16 trial match proofs on chain and writes validation attestations"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "drugrep_verifier"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "drugrep_registry/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.1"
drugrep_registry = { path = "../drugrep_registry", features = ["cpi"] }
groth16-solana = "0.2.0"

[dev-dependencies]
litesvm = "0.18.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-compute-budget-interface = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
